name: Build Manufacturing Business Manager for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Get project files
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run checks
        run: npm test
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer and portable app
        uses: actions/upload-artifact@v4
        with:
          name: Manufacturing-Business-Manager-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
